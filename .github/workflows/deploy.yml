name: Deploy to VPS

# push 到 main 自動部署到 VPS（需先在 repo Settings → Secrets 設定 VPS_SSH_KEY 與 VPS_HOST）
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy chatroom（保留 VPS 上的貼圖與 node_modules）
        run: |
          HOST=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          rsync -az --delete \
            --exclude node_modules --exclude stickers \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            chatroom/ "root@${HOST}:/root/chatroom/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "root@${HOST}" \
            "cd /root/chatroom && npm install --omit=dev >/dev/null 2>&1; printf '%s' '${{ github.sha }}' | cut -c1-7 > /root/chatroom/.build; systemctl restart chatroom"

      - name: Deploy web_danmaku（只同步程式碼，保留 .env / venv / 統計）
        run: |
          HOST=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            web_danmaku.py liveMan.py a_bogus.js sign.js sign_v0.js webmssdk.js \
            ac_signature.py gift_names.json requirements.txt protobuf \
            "root@${HOST}:/root/danmaku/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "root@${HOST}" \
            "systemctl restart danmaku"
