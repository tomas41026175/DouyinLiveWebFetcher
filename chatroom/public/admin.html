<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>貼圖管理</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4ede1; color: #2e2a24; padding: 20px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .hint { color: #6b6256; font-size: 13px; }
    .hidden { display: none !important; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    input[type=password], input[type=file] { font-size: 16px; padding: 8px 10px; border: 1px solid #e3d9c8; border-radius: 8px; background: #fff; color: #2e2a24; }
    .btn { padding: 9px 16px; border: none; border-radius: 8px; background: #c0673b; color: #fff; font-size: 15px; cursor: pointer; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; }
    .link { color: #c0673b; font-size: 13px; cursor: pointer; text-decoration: underline; }
    .msg { margin: 8px 0; font-size: 14px; min-height: 20px; }
    .msg.ok { color: #4c9e6a; } .msg.err { color: #b1442f; }
    .chpw { margin: 6px 0 10px; }
    .chpw summary { cursor: pointer; color: #6b6256; font-size: 14px; padding: 4px 0; user-select: none; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      h1 { font-size: 20px; }
      .bar { flex-direction: column; align-items: stretch; gap: 8px; margin: 12px 0; }
      .bar input, .bar .btn { width: 100%; }
      .btn { padding: 12px 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
      .card { padding: 6px; }
      .card img { height: 72px; }
      .card .del { padding: 8px; }
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 8px; }
    .card { background: #fff; border: 1px solid #e3d9c8; border-radius: 10px; padding: 8px; text-align: center; }
    .card img { width: 100%; height: 90px; object-fit: contain; }
    .card .nm { font-size: 11px; color: #6b6256; word-break: break-all; margin: 4px 0; }
    .card .del { background: #b1442f; color: #fff; border: none; border-radius: 6px; padding: 5px 8px; font-size: 12px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>貼圖管理</h1>

    <!-- 登入區 -->
    <div id="loginBox">
      <p class="hint">輸入管理密碼以管理貼圖。</p>
      <div class="bar">
        <input type="password" id="pw" placeholder="管理密碼" autocomplete="current-password" />
        <button class="btn" id="loginBtn" type="button">登入</button>
      </div>
    </div>

    <!-- 管理區（驗證通過才顯示）-->
    <div id="adminBox" class="hidden">
      <p class="hint">支援 png / jpg / gif / webp，單張 ≤ 5MB（上傳自動壓縮）。可多選或拖拉批量上傳。　<span class="link" id="logoutBtn">登出</span></p>
      <div class="bar">
        <input type="file" id="file" accept="image/*" multiple />
        <button class="btn" id="uploadBtn" type="button">上傳</button>
      </div>
      <details class="chpw">
        <summary>🔑 修改管理密碼</summary>
        <div class="bar">
          <input type="password" id="newpw" placeholder="新密碼（至少 4 字）" autocomplete="new-password" />
          <button class="btn" id="chpwBtn" type="button">修改密碼</button>
        </div>
      </details>
      <div class="grid" id="grid"></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const grid = $('grid'), msg = $('msg'), pw = $('pw');
    let currentPw = ''; // 驗證通過後的密碼
    const say = (t, ok) => { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
    const remember = (p) => { try { localStorage.setItem('sticker_admin_pw', p); } catch { /* ignore */ } };

    const showAdmin = () => { $('loginBox').classList.add('hidden'); $('adminBox').classList.remove('hidden'); load(); };
    const showLogin = () => { $('adminBox').classList.add('hidden'); $('loginBox').classList.remove('hidden'); };

    // 輸入密碼後直接驗證；通過才顯示管理區並隱藏密碼欄
    const verify = async (p) => {
      if (!p) return say('請輸入管理密碼', false);
      try {
        const r = await fetch('/stickers/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p }) });
        const j = await r.json();
        if (j.ok) { currentPw = p; remember(p); pw.value = ''; say('', true); showAdmin(); }
        else say('密碼錯誤', false);
      } catch { say('驗證失敗', false); }
    };
    $('loginBtn').onclick = () => verify(pw.value);
    pw.onkeydown = (e) => { if (e.key === 'Enter') verify(pw.value); };
    $('logoutBtn').onclick = () => { currentPw = ''; remember(''); say('已登出', true); showLogin(); };

    const load = async () => {
      try {
        const r = await fetch('/stickers');
        const { stickers } = await r.json();
        grid.innerHTML = '';
        if (!stickers.length) { grid.innerHTML = '<p class="hint">尚無貼圖</p>'; return; }
        stickers.forEach((nm) => {
          const c = document.createElement('div'); c.className = 'card';
          const img = document.createElement('img'); img.src = '/stickers/' + encodeURIComponent(nm); img.alt = nm; img.loading = 'lazy';
          const nd = document.createElement('div'); nd.className = 'nm'; nd.textContent = nm;
          const b = document.createElement('button'); b.className = 'del'; b.type = 'button'; b.textContent = '刪除';
          b.onclick = () => del(nm);
          c.append(img, nd, b); grid.appendChild(c);
        });
      } catch { say('載入清單失敗', false); }
    };

    const fileToDataURL = (f) => new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f);
    });

    // 上傳前壓縮：非 GIF 縮到 ≤512px + 重新編碼（GIF 保留動圖不壓）
    const compressImage = (f) => new Promise((resolve) => {
      if (f.type === 'image/gif') { fileToDataURL(f).then(resolve); return; }
      const img = new Image();
      img.onload = () => {
        const MAX = 512;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round((h * MAX) / w); w = MAX; } else { w = Math.round((w * MAX) / h); h = MAX; }
        }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const type = f.type === 'image/png' ? 'image/png' : (f.type === 'image/webp' ? 'image/webp' : 'image/jpeg');
        resolve(type === 'image/png' ? c.toDataURL(type) : c.toDataURL(type, 0.85));
      };
      img.onerror = () => fileToDataURL(f).then(resolve);
      fileToDataURL(f).then((d) => { img.src = d; });
    });

    const uploadFiles = async (files) => {
      if (!currentPw) return say('請先登入', false);
      const imgs = files.filter((f) => f.type.startsWith('image/'));
      if (!imgs.length) return say('請選擇圖片', false);
      let ok = 0, fail = 0;
      const btn = $('uploadBtn'); btn.disabled = true;
      for (let i = 0; i < imgs.length; i += 1) {
        const f = imgs[i];
        say(`上傳中… ${i + 1}/${imgs.length}`, true);
        try {
          const dataUrl = await compressImage(f);
          const r = await fetch('/stickers/upload', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: currentPw, name: f.name, dataUrl }),
          });
          const j = await r.json();
          if (j.ok) ok += 1; else { fail += 1; say(`「${f.name}」失敗：${j.err || '未知錯誤'}`, false); }
        } catch { fail += 1; }
      }
      btn.disabled = false; $('file').value = '';
      say(`完成：成功 ${ok} 張${fail ? `，失敗 ${fail}` : ''}`, fail === 0);
      load();
    };
    $('uploadBtn').onclick = () => uploadFiles([...$('file').files]);
    // 拖拉批量上傳（登入後拖圖片到頁面任一處）
    ['dragover', 'dragenter'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      if (currentPw) uploadFiles([...(e.dataTransfer ? e.dataTransfer.files : [])]);
    });

    const del = async (nm) => {
      if (!currentPw) return say('請先登入', false);
      if (!confirm(`確定刪除「${nm}」？`)) return;
      try {
        const r = await fetch('/stickers/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: currentPw, name: nm }),
        });
        const j = await r.json();
        if (j.ok) { say(`已刪除 ${nm}`, true); load(); } else say(`刪除失敗：${j.err || '未知錯誤'}`, false);
      } catch { say('刪除失敗', false); }
    };

    // 改密碼：已登入，舊密碼用 currentPw，只需輸新密碼
    $('chpwBtn').onclick = async () => {
      const newPassword = $('newpw').value.trim();
      if (newPassword.length < 4) return say('新密碼至少 4 字', false);
      try {
        const r = await fetch('/stickers/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPassword: currentPw, newPassword }) });
        const j = await r.json();
        if (j.ok) { currentPw = newPassword; remember(newPassword); $('newpw').value = ''; say('✅ 管理密碼已修改', true); }
        else say('修改失敗：' + (j.err || '未知錯誤'), false);
      } catch { say('修改失敗', false); }
    };

    // 載入時若已存密碼 → 自動驗證登入（失敗則停在登入畫面）
    const saved = localStorage.getItem('sticker_admin_pw') || '';
    if (saved) verify(saved);
  </script>
</body>
</html>
